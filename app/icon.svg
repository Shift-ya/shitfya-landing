<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0a1a"/>
      <stop offset="100%" stop-color="#150d2e"/>
    </linearGradient>
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed7ff"/>
      <stop offset="50%" stop-color="#7f4dff"/>
      <stop offset="100%" stop-color="#f52ccf"/>
    </linearGradient>
    <linearGradient id="letter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed7ff"/>
      <stop offset="55%" stop-color="#7f4dff"/>
      <stop offset="100%" stop-color="#f52ccf"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Border glow -->
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none"
        stroke="url(#stroke-grad)" stroke-width="1.5" opacity="0.7"/>

  <!-- Stylized S -->
  <text
    x="32"
    y="46"
    text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="42"
    fill="url(#letter-grad)"
    letter-spacing="-1"
  >S</text>

  <!-- Dot accent (the .ya dot) -->
  <circle cx="46" cy="48" r="4" fill="#f52ccf" opacity="0.85"/>
</svg>
